name: Docker Image

on:
  push:
    branches: [main, prod-hardening-aws-cleanup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: brandng/clone-crm-4-u-migration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          docker buildx build --progress=plain --file ./Dockerfile . 2>&1 | tee docker-build.log
        shell: bash

      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          REF_TAG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-')"
          TAG_ARGS=(
            --tag "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            --tag "${REGISTRY}/${IMAGE_NAME}:${REF_TAG}"
          )
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG_ARGS+=(--tag "${REGISTRY}/${IMAGE_NAME}:latest")
          fi
          docker buildx build \
            --progress=plain \
            --file ./Dockerfile \
            "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}" \
            --push \
            . 2>&1 | tee docker-build.log
        shell: bash

      - name: Summarize Docker build failure
        if: failure()
        run: |
          {
            echo "## Docker build log tail"
            echo
            echo '```text'
            if [ -f docker-build.log ]; then
              tail -n 160 docker-build.log
            else
              echo "docker-build.log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
